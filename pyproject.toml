[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pwm-tmsp"
version = "0.3.1a1"
description = "Hierarchical PWM time-mode primitives and fixed-cycle co-simulation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]
classifiers = ["Development Status :: 3 - Alpha", "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)"]

[project.optional-dependencies]
research = ["scipy>=1.10", "pandas>=2", "numba>=0.59", "tabulate>=0.9"]

[tool.setuptools]
packages = ["tmsp"]

[tool.setuptools.package-data]
tmsp = ["data/*.csv", "data/*.json", "data/cards/*.json", "data/verilog_a/*.va"]

[tool.pytest.ini_options]
testpaths = ["tests"]
